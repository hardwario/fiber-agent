# application/.gitlab/ci/mr_checks.yml
.mr_rust_base:
  image: rust:1.94-bookworm
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  # Native build deps. rust:bookworm ships none of these, and every one of them
  # is a hard requirement of the default feature set, so without this the jobs
  # fail in the build-script stage before compiling any of our own code:
  #   libdbus-1-dev      -> bluer (unconditional dep, features = ["full"])
  #   libssl-dev         -> rusqlite "bundled-sqlcipher" links system OpenSSL
  #   protobuf-compiler  -> build.rs calls prost_build::compile_protos
  # build_release.yml installs the same set (:arm64) for the cross build.
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends
        pkg-config libssl-dev libdbus-1-dev protobuf-compiler
  cache:
    key:
      files: [Cargo.lock, rust-toolchain.toml]
    # .cargo/bin caches cargo-nextest/cargo-audit binaries (see below) so
    # they aren't re-downloaded/rebuilt on every pipeline run.
    paths: [.cargo/registry/index, .cargo/registry/cache, .cargo/bin, target/]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

build:check:
  extends: .mr_rust_base
  stage: test
  script:
    - cargo build --locked

test:unit:
  extends: .mr_rust_base
  stage: test
  # cargo-nextest, not cargo test: gives us JUnit output (wired below) for
  # GitLab's Test Report tab, which plain `cargo test` has no stable way to
  # produce (JSON test output is nightly-only).
  # --test-threads 1: several tests share global state and race under a
  # multi-threaded runner. Serializing keeps the gate deterministic.
  # FOLLOW-UP: fix the shared-state races so the suite is parallel-safe.
  variables:
    # This job runs as root (rust:1.94-bookworm + apt-get in before_script), and
    # root holds CAP_DAC_OVERRIDE, so no file mode can deny it anything. Two
    # tests need a denial to prove their point and therefore cannot mean
    # anything here. Neither of them is covered by this pipeline at all:
    #
    #   libs::factory_reset::tests::
    #     an_entry_that_cannot_be_removed_still_leaves_the_recreated_dirs_behind
    #   libs::factory_reset::tests::
    #     is_corrupt_is_false_for_a_file_that_exists_but_cannot_be_read
    #
    # Without this variable those tests *fail* rather than skipping quietly, so
    # the coverage this pipeline is giving up has to be declared here, in the
    # open, instead of disappearing into a green run. What it stops covering in
    # CI:
    #
    #   1. A factory-reset wipe whose removal is denied by filesystem
    #      permissions collects the error, carries on past the stuck entry, and
    #      still recreates /data/chirpstack and /data/lorawan. Partly mitigated:
    #      `a_recreate_error_alone_degrades_the_status_and_still_creates_the_rest`
    #      covers the same status/result/recreate contract here through an
    #      injection root cannot bypass.
    #   2. `ResetOutcome::is_corrupt` returning false for a result file that
    #      exists but could not be *read* this once — the regression test for the
    #      bug where a transient I/O error made main.rs's boot hook delete the
    #      only on-disk record of a reset's outcome. This one has NO substitute
    #      coverage in CI: an unreadable-but-present file is only producible via
    #      mode bits, which root ignores.
    #
    # A local `cargo test` as an ordinary user covers both. Every other
    # guardrail and failure path in that module runs unweakened as root.
    #
    # FOLLOW-UP: run this job's tests as a non-root user (create one, chown
    # $CI_PROJECT_DIR, `setpriv --reuid`) and drop this variable — then CI's
    # signal matches a local run exactly.
    FIBER_TEST_ALLOW_ROOT_SKIPS: "1"
  before_script:
    - !reference [.mr_rust_base, before_script]
    - mkdir -p "${CARGO_HOME}/bin"
    # Same PATH-vs-CARGO_HOME mismatch as audit:deps below: check the actual
    # binary path, not `command -v`, or the cache never gets used.
    - test -x "${CARGO_HOME}/bin/cargo-nextest" || curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "${CARGO_HOME}/bin"
  script:
    - cargo nextest run --locked --profile ci --test-threads 1
  artifacts:
    when: always
    reports:
      junit: target/nextest/ci/junit.xml

lint:fmt:
  extends: .mr_rust_base
  stage: test
  before_script:
    - !reference [.mr_rust_base, before_script]
    - rustup component add rustfmt
  script:
    - cargo fmt --check

audit:deps:
  extends: .mr_rust_base
  stage: test
  # Non-blocking for now, same posture as lint:clippy below: report on every
  # MR while we confirm the dependency tree is actually clean.
  # FOLLOW-UP: remove allow_failure once a clean baseline is confirmed.
  allow_failure: true
  before_script:
    - !reference [.mr_rust_base, before_script]
    # CARGO_HOME is overridden above (for caching) to a path outside the
    # image's default PATH, so `command -v cargo-audit` never finds the
    # cached binary and always re-triggers install -- which then fails
    # because the binary is already sitting there. Check the actual path.
    - test -x "${CARGO_HOME}/bin/cargo-audit" || cargo install cargo-audit --locked
  script:
    - cargo audit

lint:clippy:
  extends: .mr_rust_base
  stage: test
  # Non-blocking for now: the tree has ~157 pre-existing clippy findings.
  # Reports on every MR so new code is visible, but does not gate merges yet.
  # FOLLOW-UP: burn down the backlog (see below), then remove allow_failure
  # to make clippy a hard gate.
  #   - ~90 auto-fixable:  cargo clippy --fix --allow-dirty --all-targets
  #   - 29 too_many_arguments / 6 dead_code: targeted #[allow] or refactor
  #   - 2 await_holding_lock: real correctness smells — fix by hand
  allow_failure: true
  # A job-level before_script replaces the inherited one rather than appending,
  # so pull the base deps in explicitly.
  before_script:
    - !reference [.mr_rust_base, before_script]
    - rustup component add clippy
  script:
    - cargo clippy --all-targets -- -D warnings

lint:commits:
  image: node:20-alpine
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apk add --no-cache git
    - npm install --no-save @commitlint/cli @commitlint/config-conventional
  script:
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - npx commitlint --from "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --to HEAD --verbose
