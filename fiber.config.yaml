power:
  update_interval_ms: 60000
  battery:
    min_voltage_mv: 3100
    max_voltage_mv: 3400
    low_threshold_percent: 20
    critical_threshold_percent: 5
  ac_power:
    # DC-present hysteresis. One signal drives the LED, the LCD, MQTT, fiberctl,
    # the POWER_DISCONNECT alarm and the standby resume, so they cannot disagree.
    #
    # Not 12000: the southbridge reports VIN through two integer truncations, so a
    # perfect 12.000 V input reports 11998 mV and 12000 is not even reachable.
    # VIN is either the ~12 V rail or near zero on battery, so 11000/10000
    # separates the two states with room to spare.
    dc_connect_mv: 11000
    dc_disconnect_mv: 10000
    # Superseded by the two above; kept so older configs keep parsing.
    detection_threshold_mv: 12000
    battery_mode_threshold_mv: 11000
  led_blink:
    toggle_count: 10
  standby:
    # Deep standby is what a Viewer power-off puts the device into. The agent
    # stays alive reading VIN so that reconnecting PoE brings it back — nothing
    # on this board can wake a halted CM4.
    #
    # Polled far more often than update_interval_ms above. This interval is both
    # the wake latency and the window in which a PoE interruption can be sampled
    # directly — at 5000 a quick unplug/replug fell between two polls and the
    # device never woke. Costs almost nothing: the SoC is awake regardless and
    # each read is one UART round trip.
    poll_interval_ms: 1000
    resume_on_dc: true
    # Consecutive above-threshold reads before resuming, so a cable being
    # wiggled cannot thrash the device in and out of standby.
    confirm_polls: 2
    # Empty string leaves the governor alone.
    cpu_governor: powersave
  buzzer:
    enabled: true
    battery_mode_beep_interval_ms: 10000
    vin_disconnect_duration_ms: 2000
    critical_beep_on_ms: 200
    critical_beep_off_ms: 200
sensors:
  num_lines: 8
  sample_interval_ms: 2000
  aggregation_interval_ms: 15000
  report_interval_ms: 60000
  failure_threshold: 3
  warmup_threshold: 3
serial:
  port: /dev/ttyAMA4
  baud_rate: 115200
accelerometer:
  enabled: true
  i2c_path: /dev/i2c-10
  update_interval_ms: 100
  motion_threshold_g: 0.3
  debounce_samples: 5
  logging_enabled: true
storage:
  db_path: /data/fiber/fiber_medical.db
  # max_size_mb takes precedence over max_size_gb when set. 2500 MB
  # (2.5 GB) cap on a typical 4 GB /data partition shared with the
  # fiber-viewer DB — see StorageConfig::effective_max_bytes.
  max_size_gb: 3
  max_size_mb: 2500
system:
  debug_mode: false
  app_name: FIBER Application
  app_version: 0.1.0
  timezone_offset_hours: 0
  device_label: FIBER
  led_brightness: 25
  screen_brightness: 50
  # Backlight off after this many seconds of no button activity (an active alarm
  # keeps it lit). 0 = never.
  screen_timeout_secs: 3600
# Physical display (ST7920 LCD) overview screen.
#
# Without `custom_lines` the overview shows the built-in layout: the 8 DS18B20
# probes then any LoRaWAN stickers, active ones first. Set `custom_lines` to
# compose the screen from individually chosen values instead — 4 rows per page,
# max 16 lines. Normally written from the FIBER Viewer, not by hand.
#
# display:
#   custom_lines:
#     # source: sticker  -> addressed by dev_eui (16 hex chars)
#     #   field: any LoRaWAN registry field (temperature, humidity, voltage,
#     #          ext_temperature_1/2, machine_probe_*, pressure, altitude,
#     #          illuminance, *_count) or rssi / snr / status
#     - source: sticker
#       dev_eui: "70b3d57ed0051f2a"
#       field: ext_temperature_1
#       label: "Stkr1 ext"
#     # source: ds18b20  -> addressed by line index 0-7
#     #   field: temperature | status
#     - source: ds18b20
#       line: 0
#       field: temperature
#       label: "Probe 1"
#     - source: sticker
#       dev_eui: "70b3d57ed0051f2a"
#       field: voltage
#       label: "Stkr1 bat"
#       format:
#         units: true         # append °C / % / V / hPa / m / lx / dBm / dB
#         decimals: 2         # 0-3; omit for the per-field default
#         status_char: false  # hide the N/W/C/E status character
mqtt:
  enabled: true
  broker:
    host: localhost
    port: 1883
    client_id: ''
    username: fiber
    password: 'fiber_dev'
  # TLS: disabled by default (app connects to local broker on same device)
  # Enable and set ca_cert_path when connecting to a remote broker
  tls:
    enabled: false
    ca_cert_path: "/data/tls/server.crt"
    insecure_skip_verify: false
  publish:
    topic_prefix: fiber
    include_hostname: true
    default_qos: 0
    qos_overrides:
      sensor_readings: 0
      power_status: 1
      alarm_events: 2
      power_events: 2
      network_status: 0
    intervals:
      sensors_sec: 5
      power_sec: 10
      network_sec: 30
      system_info_sec: 60
    max_queue_size: 10000
  subscribe:
    enabled: true
    max_commands_per_second: 10
    audit_enabled: true
  connection:
    keep_alive_sec: 30
    connection_timeout_sec: 10
    max_reconnect_attempts: 0
    reconnect_delay_sec: 1
    max_reconnect_delay_sec: 60
    clean_session: false
  last_will:
    enabled: true
    topic: status
    payload: '{"status":"offline","reason":"unexpected_disconnect"}'
    qos: 1
    retain: true
ble:
  enabled: true                # dev platform: in-app BLE GATT server is active
  pin: "123456"                # BLE pairing PIN. Edit to rotate.
  enable_terminal: true        # FB05/FB06 terminal-over-BLE; set false for stricter deployments
  advertising_name: null       # null → use device hostname; set to "FIBER-DEV" if mobile filters by name

# LoRaWAN gateway bridge. Whether the bridge runs is decided by hardware
# detection (concentratord/chirpstack running, or a configured external
# gateway), not by a flag here — see `lorawan::detector`.
lorawan:
  # Credentials for the on-device ChirpStack gRPC-web API. The API address is
  # not configurable: ChirpStack always runs on this same device, so loopback is
  # part of the deployment contract rather than a setting.
  chirpstack:
    username: admin
    # Populate at deployment — see README, "Provisioning ChirpStack credentials".
    # Empty here on purpose: a password must never be committed. While it is
    # empty the LoRaWAN bridge refuses to start instead of falling back to
    # ChirpStack's public factory credentials.
    password: ""

# Teltonika EYE BLE sensor tags (BTSMP1).
# Tags are read passively from their BLE advertising. `auto_provision` applies the
# PROXIMOS profile (one connect, default PIN 123456) to tags listed in `tags:`
# below — it never registers a tag it has not been told about. To surface
# unregistered tags in earshot as candidates for the viewer to offer, set
# `auto_discover: true` (visibility only; it writes nothing to `tags:`). Both are
# togglable at runtime via the signed `set_eye_config` command from the viewer.
eye:
  enabled: true                # set false to switch the EYE tag monitor off
  publish_interval_s: 30
  tag_timeout_s: 600           # mark a tag stale if unseen for this long
  auto_provision: true         # apply the PROXIMOS profile to tags listed below
  # auto_discover: false       # (default) surface unregistered tags as candidates
  # auto_discover_max: 32      # cap on candidates held at once
  tags:
    - mac: "7C:D9:F4:13:10:DE"
      name: "EYE tag 1"
      enabled: true
