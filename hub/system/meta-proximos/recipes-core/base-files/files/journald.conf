[Journal]
Storage=persistent
SystemMaxUse=200M
# Above the agent's DISK_FREE_FLOOR (256M, #124): on a filling /data the
# journal gives up its oldest files before the agent deletes measurements.
SystemKeepFree=320M
SystemMaxFileSize=50M
MaxRetentionSec=3y
Compress=yes
ForwardToSyslog=no
RateLimitIntervalSec=30s
RateLimitBurst=10000
