# /etc/hosts is a symlink to /run/proximos/net/hosts (base-files_%.bbappend), and
# this seeds that file at every boot from the content base-files shipped as
# /etc/hosts, now kept at /usr/share/proximos/hosts.base.
#
# Why a runtime file: on a Client Hub the agent (fiber_app) keeps one line in it,
# `<Server IPv4> <server_host>`, so that chirpstack-mqtt-forwarder - a static
# musl binary with no NSS, hence no nss-mdns - can reach `<server>.local` by
# name and verify the Server's DNS-only SANs (plan/control/cluster.md §5, §8).
# The agent rewrites the file by temp-and-rename, which needs a directory it
# alone may write: fiber.service has ReadWritePaths=-/run/proximos/net and
# nothing else under /etc or /run/proximos.
#
# On a Server the file is just the base content. set-hostname.sh
# (hostname-serial.service, ordered after systemd-tmpfiles-setup.service)
# rewrites its 127.0.1.1 line at every boot, as it did when /etc/hosts was a
# plain file. tmpfs, so every boot starts from the base again: a role change is
# a factory reset plus a reboot, and nothing stale survives it.
#
# `C` copies only when the target is absent, so a `systemd-tmpfiles --create`
# later in the boot does not drop the agent's line.
d /run/proximos/net 0755 root root -
C /run/proximos/net/hosts 0644 root root - /usr/share/proximos/hosts.base
