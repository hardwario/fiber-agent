d /data/rauc 0700 root root -
d /data/network 0700 root root -
d /data/network/system-connections 0700 root root -
d /data/qbee 0755 root root -
d /data/qbee/etc 0700 root root -
d /data/qbee/var 0700 root root -
d /data/log 0755 root root -
d /data/log/journal 2755 root systemd-journal -
# 0711, not 0700: the portal (user proximos) serves ca.crt at /connection/ca
# (plan/control/cluster.md section 6) and must be able to open it by name. It
# cannot list the directory. ca.key stays 0600 root, server.key is 0640
# root:mosquitto (proximos-tls-cert.sh, for the 8883 listener). tmpfiles
# re-applies the mode to an existing directory, so upgraded Hubs follow.
d /data/tls 0711 root root -
# The 8883 listener's account files (plan/control/cluster.md §5). mosquitto
# runs as mosquitto and opens both at start-up and on every SIGHUP; the agent
# (root) mints and removes accounts by writing a temporary file in this
# directory and renaming it over one of these (cluster.md §7). The directory
# is root's so only root can create or rename entries in it; the files are
# mosquitto's own, 0600, because mosquitto 2.1 warns about, and announces it
# will refuse, a password or ACL file that is not owned by the user it runs
# as. Both start empty so the listener comes up with no account at all, and
# "f" never overwrites an existing file - but it does re-apply the owner and
# mode on every boot, so a rename that left them wrong heals at the next one.
d /data/mosquitto 0750 root mosquitto -
f /data/mosquitto/passwd 0600 mosquitto mosquitto -
f /data/mosquitto/acl 0600 mosquitto mosquitto -
# mosquitto's persistence database (proximos.conf, #115): written by the
# broker after it drops to the mosquitto user, so the directory is its own.
d /data/mosquitto/persist 0700 mosquitto mosquitto -
# A Client Hub's connection to its Server and the role marker
# (plan/control/cluster.md section 3). The cluster join in fiber_app (root)
# writes it - BLE FB1C or proximosctl control.radio create --role client -
# and proximos-render (root) reads it at boot. fiber.service may write this
# directory and nothing else under /data/proximos besides its own, so it must
# exist before the agent starts: ProtectSystem=strict leaves /data/proximos
# read-only to it, and it cannot create the directory itself. 0700: the
# peer password lives here. Empty on a Server; absence of role means server.
d /data/proximos/cluster 0700 root root -
