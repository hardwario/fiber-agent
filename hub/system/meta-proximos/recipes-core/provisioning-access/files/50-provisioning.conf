# The provisioning station's account (plan/system/factory_test.md §4.1): it runs
# provisioning-shell and nothing else, with no forwarding of any kind, so it can
# neither get a shell nor reach the Hub's local services through SSH.
Match User provisioning
	ForceCommand /usr/libexec/proximos/provisioning-shell
	AllowTcpForwarding no
	AllowStreamLocalForwarding no
	AllowAgentForwarding no
	X11Forwarding no
	PermitTunnel no
	PermitTTY no
	PermitUserRC no
