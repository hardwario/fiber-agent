[Unit]
# redis is ChirpStack's cache and nothing else's on a Hub, so it runs exactly where
# ChirpStack does: on a Server whose radio.mode is lorawan or dual. The renderer writes
# this file only there (crates/proximos-render outputs::chirpstack); a Client
# (plan/control/cluster.md §2, decision #8) and an off/p2p Hub get none, and redis
# condition-skips with it. Same path, same spelling as chirpstack.service's and
# chirpstack-bootstrap.service's own condition — proximos-render's unit_contract_tests
# hold the three together.
#
# After= is load-bearing, not tidy: a condition is judged when the start job runs, and a
# redis started before the renderer would see no file, skip, and leave chirpstack's
# Requires=redis.service satisfied by a redis that is not running.
ConditionPathExists=/run/proximos/chirpstack/chirpstack.toml
After=proximos-render.service

[Service]
NoNewPrivileges=true
PrivateTmp=true
PrivateDevices=true
ProtectHome=true
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
