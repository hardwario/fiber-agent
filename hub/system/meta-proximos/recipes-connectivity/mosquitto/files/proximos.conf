# The Hub's broker (plan/control/cluster.md §5, decision #38).
#
# First, before any security option (mosquitto refuses it after one). Without
# it password_file/acl_file would be global, and the anonymous loopback
# clients would fall under the 8883 ACL, which grants them nothing. mosquitto
# 2.1 logs it as deprecated (removal is announced for 3.0); it is still the
# 2.1.2 way to give two listeners different authentication.
per_listener_settings true

# Loopback, anonymous, plaintext: the portal, the agent, ChirpStack, the
# forwarder and proximos-control (whose 127.0.0.1:1883 is a constant). The
# device itself is the trust boundary here. Unchanged by the 8883 listener.
listener 1883 127.0.0.1
allow_anonymous true
# A listener option: it caps this listener, not the broker.
max_connections 50

max_queued_messages 1000

# Persistent sessions survive a broker restart (plan/portal/mqtt/design.md §6,
# amendment 2026-10-28, #115): the portal connects with clean_session false,
# and without persistence a mosquitto restart dropped its subscription, so the
# readings the P2P outbox drained right after the restart reached nobody. A
# global option. The directory is mosquitto's own (data-dirs.conf);
# /data/mosquitto itself stays root's for the 8883 account files.
persistence true
persistence_location /data/mosquitto/persist/
autosave_interval 300

# The Server's TLS listener for Client Hubs (cluster.md §2, §5) is not in
# this file: proximos-render writes it to /run/proximos/mosquitto/8883.conf on
# a Server only (template: portal/packaging/templates/mosquitto/8883.conf.j2)
# and removes it on a Client, whose broker is this loopback listener alone.
# mosquitto.conf includes that directory after this one (mosquitto 2.1.2
# accepts include_dir only in the main file), so per_listener_settings above
# is already set when the 8883 listener is read. Global options go here, not
# there.
