# The directory proximos-render writes the Server's 8883 listener into
# (plan/control/cluster.md §2, §5). mosquitto.conf has
# `include_dir /run/proximos/mosquitto`, and mosquitto 2.1.2 refuses to start
# when an include_dir cannot be opened ("Unable to open include_dir"), 1883
# included. An empty directory is fine - that is a Client, or a Server whose
# render failed - so it exists from systemd-tmpfiles-setup.service on, long
# before mosquitto.service, whatever the renderer does. Not one of
# proximos-render.service's RuntimeDirectory= entries on purpose: systemd
# removes those when that unit stops or fails, and the broker would then not
# start.
d /run/proximos/mosquitto 0755 root root -
