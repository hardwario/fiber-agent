# mosquitto.service (upstream: User=mosquitto, ExecReload=kill -HUP) on the
# ProXimos Hub. The loopback listener is static (conf.d/proximos.conf); the
# Server's 8883 listener is rendered by proximos-render into
# /run/proximos/mosquitto/8883.conf on a Server only (plan/control/cluster.md
# §2, §5). A listener that cannot load its files stops the whole broker,
# loopback 1883 included, so mosquitto waits for what it reads:
#
# - /run/proximos/mosquitto/, mosquitto.conf's second include_dir. Created
#   empty by tmpfiles (proximos-mosquitto.conf) long before this unit, so it
#   opens with or without a render. After=proximos-render.service so that on a
#   Server the broker's first start already sees 8883.conf. Wants=, not
#   Requires=: a failed render must leave a loopback broker (and with no
#   8883.conf, no network listener at all - the safe side), not none.
#   proximos-render.service orders itself after the data units only, never
#   after mosquitto, so this adds no cycle.
# - /data/mosquitto/{passwd,acl}, created empty by proximos-data-dirs. Without
#   them a Server's mosquitto does not start; Requires=, because nothing works
#   then.
# - /data/tls/server.{crt,key}, kept by proximos-tls-cert. Wants=, not
#   Requires=: on an ordinary boot the pair is already there from the last
#   one, and a failed re-check must not also take the loopback broker down.
#   Only a Server reads them; a Client's broker starts without its TLS pair.
#
# The network is not on that list. The broker binds 127.0.0.1:1883 and, on a
# Server, 0.0.0.0:8883, and it runs no bridge, so it needs no route to start.
# After=network.target is enough: it starts once NetworkManager is up and stops
# before it at shutdown. Upstream's unit wanted network-online.target instead,
# which pulls in NetworkManager-wait-online (nm-online -s, 60 s). That waits
# for every startup profile, so a Hub on WiFi with eth0 linked to a switch
# without DHCP held the broker, and everything ordered after it, 60 s on every
# boot and then reported degraded (GitLab #98). A drop-in cannot take those
# dependencies back; mosquitto_%.bbappend deletes them from the unit with
# mosquitto-unit.sed.
[Unit]
RequiresMountsFor=/data
Requires=proximos-data-dirs.service
After=proximos-data-dirs.service
Wants=proximos-tls-cert.service
After=proximos-tls-cert.service
Wants=proximos-render.service
After=proximos-render.service
After=network.target
