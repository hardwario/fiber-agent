# The ChirpStack service account (system/design.md §6.1: users come from
# sysusers.d fragments per package, never from useradd in a firstboot script -
# which is how v1 created its accounts).
#
# This fragment is the authority; chirpstack_4.19.1.bb's USERADD_PARAM mirrors it
# line for line, because useradd.bbclass runs at image-construction time while
# this file is processed on target, and the two must not be able to disagree.
#
# No shell. The home directory is a placeholder that is deliberately never
# created: everything this account owns lives in /data/chirpstack (0700, created
# by migration 005-chirpstack-seed.sh), because nothing mutable belongs on the
# rootfs.
u chirpstack - "ChirpStack LNS" /var/lib/chirpstack /sbin/nologin
