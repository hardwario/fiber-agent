BBPATH =. "${LAYERDIR}:"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "proximos"
BBFILE_PATTERN_proximos = "^${LAYERDIR}/"
BBFILE_PRIORITY_proximos = "12"

LAYERSERIES_COMPAT_proximos = "wrynose"

LAYERDEPENDS_proximos = "core rauc raspberrypi meta-qbee networking-layer openembedded-layer meta-python rust-bin-layer"

PROXIMOS_LAYERDIR := "${LAYERDIR}"

PROXIMOS_SRC := "${PROXIMOS_LAYERDIR}/../.."
