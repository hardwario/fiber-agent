DISTRO = "proximos"
DISTRO_NAME = "ProXimos Hub OS"

DISTRO_VERSION = "${@d.getVar('PROXIMOS_VERSION') or '2.0'}"

INIT_MANAGER = "systemd"

DISTRO_FEATURES:append = " rauc bluetooth zeroconf"

DEFAULT_TIMEZONE = "UTC"

MACHINE_FEATURES:append = " rtc"

RPI_USE_U_BOOT = "1"

WKS_FILE = "sdimage-dual-raspberrypi.wks.in"
# The smoke-test machine (system/kas/kas-qemu.yml, plan/system/design.md §9.3): the
# same partitions on /dev/vda. An override naming only qemuarm64, so the CM4 value
# above is untouched.
WKS_FILE:qemuarm64 = "proximos-dual-qemuarm64.wks"

IMAGE_FSTYPES = "ext4 wic.bz2 wic.bmap"

IMAGE_VERSION_SUFFIX = ""
IMAGE_LINK_NAME = ""
IMAGE_NAME = "${IMAGE_BASENAME}${IMAGE_MACHINE_SUFFIX}${IMAGE_NAME_SUFFIX}${IMAGE_VERSION_SUFFIX}"
IMAGE_ROOTFS_SIZE = "2097152"
IMAGE_OVERHEAD_FACTOR = "1.0"
IMAGE_ROOTFS_EXTRA_SPACE = "0"
IMAGE_ROOTFS_MAXSIZE = "2097152"

CMDLINE_ROOTFS = "rootfstype=ext4 rootwait"

ENABLE_UART = "1"

RPI_EXTRA_CONFIG .= "\narm_64bit=1"
RPI_EXTRA_CONFIG .= "\notg_mode=1"
RPI_EXTRA_CONFIG .= "\ndtparam=i2c_arm=on"

KERNEL_MODULE_AUTOLOAD += "i2c-dev spi-bcm2835 spidev ds2482"
LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"
FILESYSTEM_PERMS_TABLES = "files/fs-perms.txt files/fs-perms-volatile-tmp.txt"

# System accounts get the IDs in files/proximos-passwd and files/proximos-group
# instead of the next free one at do_rootfs. /data keeps numeric owners across A/B
# updates, so an ID that moves between images takes an account's own /data tree
# away from it (issue #92). An account missing from the tables still builds, with
# a warning that names them.
USERADDEXTENSION = "useradd-staticids"
USERADD_UID_TABLES = "files/proximos-passwd"
USERADD_GID_TABLES = "files/proximos-group"
USERADD_ERROR_DYNAMIC = "warn"

PACKAGECONFIG:append:pn-systemd = " repart openssl"
PACKAGECONFIG:remove:pn-systemd = "networkd"
PACKAGECONFIG:remove:pn-systemd-conf = "dhcp-ethernet"
PACKAGECONFIG:pn-nftables = ""

QBEE_AUTO_INSTALL = "0"
QBEE_DEVICE_NAME_TYPE = "machine-id"
