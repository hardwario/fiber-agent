# Landlock for the Portal's sandbox (plan/security/landlock.md, GitLab #100).
# CONFIG_LSM is the boot-time LSM order; `capability` is always active and is
# not listed. An LSM added later (AppArmor, plan/security/apparmor.md) goes into
# this list next to `landlock`, never in place of it.
CONFIG_SECURITY=y
CONFIG_SECURITY_LANDLOCK=y
CONFIG_LSM="landlock"
