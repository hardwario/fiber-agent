# Drivers
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_LORA=y
CONFIG_RING_BUFFER=y
CONFIG_CRC=y
CONFIG_HWINFO=y

# USART1 (ttyAMA3 side) is exclusive to the P2P binary protocol - no
# console/shell on it (see the devicetree chosen{} removal + p2p-uart
# alias in boards/st/stm32wl5moc/stm32wl5moc.dts).
CONFIG_UART_CONSOLE=n

# Debug console + shell over SEGGER RTT (J-Link) instead - zero UART pins
# consumed, matches fiber-southbridge's pattern.
CONFIG_USE_SEGGER_RTT=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_PROMPT_RTT="north:~$ "
CONFIG_SHELL_RTT_RX_POLL_PERIOD=50

# Do not also enable CONFIG_LOG_BACKEND_RTT: it and the shell's own log
# backend both default to RTT buffer index 0 and hit a BUILD_ASSERT
# together (system/lora/design.md §1).
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# 1 kHz tick so the scheduled-TX k_timer can hit ms-resolution deadlines -
# the default 100 Hz tick would quantize scheduling to 10 ms, deep into the
# node's RX1 budget (system/lora/design.md §4).
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# Stack: the main thread runs the commands; GET_INFO and TWR_NODE_LIST build their RSP on it.
CONFIG_MAIN_STACK_SIZE=4096

# The sx126x DIO1 IRQ handler runs the deep loramac-node IrqProcess/RxDone chain
# (which calls lora_rx_cb) on the SYSTEM workqueue. The default 1024 B stack
# overflows there on the first received frame (MemManage fault), which silently
# kills RX. 2048 gives the RX call chain headroom.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# The gateway's clock (twr_gateway.c): every t_ms on the link and the driver hook stamps are
# k_cycle_get_64(); the 32-bit cycle counter wraps every 89 s at 48 MHz. The SysTick driver
# keeps the count in software anyway.
CONFIG_CORTEX_M_SYSTICK_64BIT_CYCLE_COUNTER=y

# 0.2.0: the independent watchdog, 8 s (northbridge_diagnostics.md §2.3).
CONFIG_WATCHDOG=y

# 0.4.0: ENTER_BOOTLOADER reboots into nbboot -> ROM bootloader (northbridge_update.md §10).
CONFIG_REBOOT=y
