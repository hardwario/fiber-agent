# Bench RTT-bridge build only (-DBENCH_RTT_BRIDGE=ON, pulled in automatically by
# app/CMakeLists.txt). The host drives the P2P protocol by writing
# `p2p_inject <hex>` to the RTT *shell* channel (0); a whole frame must land in
# a single RTT write, or the JoinAccept TX_SCHEDULE reaches the modem after its
# aim time and the node never pairs (tx stays 0, no EVT_TX_DONE). The default
# 16 B channel-0 down-buffer chunks a full hex-encoded frame across many writes
# and is too slow for that - 256 B holds a max-size frame in one write. The
# larger buffer moves _SEGGER_RTT, so re-read its address from the .elf.
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=256

# `p2p_inject <hex>` is a *shell command*, so the whole hex-encoded frame has to fit one shell
# line. Worst case is P2P_MAX_ENCODED_LEN = 570 B -> 1140 hex characters, plus 11 for
# "p2p_inject " = 1151. Zephyr's default 256 silently truncates any line past it, which on this
# bridge looks like a frame the modem never answers rather than like a buffer that is too small.
# 1200 leaves margin and costs ~1 KB of RAM on a part using a third of it.
CONFIG_SHELL_CMD_BUFF_SIZE=1200

# The RX path runs on the SYSTEM workqueue (sx126x DIO1 IRQ -> k_work_submit ->
# lora_rx_cb). Up to 0.2.x uart_link_send() stack-allocated the worst-case escaped
# frame (~570 B) plus its hex line (~1.15 KB) on the caller, so prj.conf's 2048 B
# system workqueue overflowed on the first EVT_RX after a scheduled TX (bench finding
# 2026-09-08: fault just below sys_work_q_stack while lora_rx_cb was encoding). Both
# buffers are static under the link's TX mutex now (uart_link.c); 4096 stays until a
# bench run measures the headroom again.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# The 2026-09-09 bench fault (BUS FAULT, pc/lr 0x27023144 unmapped, "Current
# thread" 4 B past __data_region_end, fatal reason 27) printed only r0-r3,
# r12, lr, pc and xpsr - no stack pointer, no callee-saved registers - so it
# could not be told apart from a second stack overflow. With this on, the
# fatal handler also dumps r4-r11 and the faulting SP (arch/arm fatal.c,
# ESF extra info). Costs ~11 KB of flash (74.3 -> 85.5 KB text, 32.9 % of the
# part) on the bench build only.
CONFIG_EXTRA_EXCEPTION_INFO=y
