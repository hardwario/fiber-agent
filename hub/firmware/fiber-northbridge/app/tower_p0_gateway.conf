# TOWER P0 bench gateway only (-DTOWER_P0_GATEWAY=ON, pulled in by app/CMakeLists.txt).

# The TWR_* event lines stamp RxDone / TX start / TxDone in microseconds from
# k_cycle_get_64() (CONFIG_CORTEX_M_SYSTICK_64BIT_CYCLE_COUNTER, prj.conf).

# A TWR_RX line with a 255 B frame and its plaintext is ~1.1 KB, and NO_BLOCK_SKIP drops any
# write that does not fit whole: room for a few lines between two J-Link polls of channel 0.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
