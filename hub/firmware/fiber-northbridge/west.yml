# Pins the Zephyr revision this firmware builds against: main as of
# 2026-03-23, the workspace snapshot the port was developed and
# hardware-validated on (see docs/sessions). Keep in sync with
# fiber-southbridge/west.yml. patches/lora/sx126x.c overlays the
# in-tree LoRa driver and is sensitive to this revision — if it stops
# compiling after a bump, re-diff the patch against the new driver.
manifest:
  remotes:
    - name: upstream
      url-base: https://github.com/zephyrproject-rtos
  projects:
    - name: zephyr
      remote: upstream
      revision: 60f8fac0ddb72059b45e04cf6dd60078e8ce0281  # main @ 2026-03-23 (v4.3.99, SDK 1.0.0)
      import:
        # Union of both bridges' needs — keep in sync with
        # fiber-southbridge/west.yml so CI can share one workspace cache.
        name-allowlist:
          - cmsis
          - cmsis_6
          - hal_stm32
          - loramac-node
          - picolibc
          - segger
