# Throwaway UART<->RTT bridge — minimal config.
#
# USART1 stays exclusive to this bridge (no Zephyr console/shell on it).
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# SEGGER RTT is the other end of the pipe. No shell on top of it either.
CONFIG_USE_SEGGER_RTT=y

# Enlarge the up (target->host) buffer to absorb boot-log bursts from the
# far end of USART1 without dropping bytes (NO_BLOCK_SKIP mode, the
# Kconfig default, drops writes instead of blocking when this fills).
# Down (host->target) traffic is just interactive typing, so it stays
# small. Sized to fit the STM32C031C6's 12 KB RAM budget.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=256

CONFIG_MAIN_STACK_SIZE=1024
CONFIG_ISR_STACK_SIZE=1024
