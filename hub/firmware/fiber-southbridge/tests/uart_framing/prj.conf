CONFIG_ZTEST=y
CONFIG_SERIAL=y
CONFIG_RING_BUFFER=y
# NOTE: CONFIG_UART_INTERRUPT_DRIVEN is deliberately NOT set. native_sim's
# UART lacks interrupt support, so the assignment would go unmet and the
# resulting Kconfig warning fails the twister run. uart_proto_init() (the
# only ISR user) is never called by this suite.
