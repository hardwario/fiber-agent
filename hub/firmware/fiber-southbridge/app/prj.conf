# Drivers
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_ADC=y

# USART1 stays exclusive to the application protocol parser
CONFIG_UART_CONSOLE=n

# Segger RTT debug channel via SWD (J-Link)
CONFIG_USE_SEGGER_RTT=y
CONFIG_CONSOLE=n
CONFIG_PRINTK=n

# Zephyr shell on RTT — minimal config to fit STM32C031C6 32 KB flash
CONFIG_SHELL=y
CONFIG_SHELL_MINIMAL=y
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_PROMPT_RTT="south:~$ "
CONFIG_SHELL_STACK_SIZE=2048
CONFIG_SHELL_CMD_BUFF_SIZE=64
CONFIG_SHELL_PRINTF_BUFF_SIZE=64

# Don't echo input — terminal client (rttt / JLinkRTTClient) echoes locally,
# so leaving shell echo on causes double-character display.
CONFIG_SHELL_ECHO_STATUS=n
CONFIG_SHELL_RTT_RX_POLL_PERIOD=50

# No log subsystem — too heavy for 32 KB flash. Use direct uart_proto for
# protocol responses and shell printk for RTT-side diagnostics.
CONFIG_LOG=n

# Picolibc — IO_INTEGER strips floating point from printf/scanf (we never
# format floats; ADC math is integer-only). Saves ~3 KB flash vs default.
CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_IO_MINIMAL=y

# Stack
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_ISR_STACK_SIZE=1024

# 1 kHz system tick. A 10 kHz tick rate had the SysTick handler servicing
# enough timeouts per second that USART1 RX bytes got dropped (overrun)
# at 115200 baud (87 µs/byte). With 1 kHz, the timeout pressure drops 10×
# and the UART RX IRQ has enough headroom to service every byte.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# Squeeze flash
CONFIG_SIZE_OPTIMIZATIONS=y
# LTO disabled — was eliding pwm_tick callback referenced only by
# Z_TIMER_INITIALIZER (a static initializer), causing the soft-PWM ISR to
# never fire.
CONFIG_LTO=n
