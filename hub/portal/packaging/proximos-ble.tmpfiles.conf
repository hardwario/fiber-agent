# Every service ships a tmpfiles.d fragment for its own directories; no service may
# assume its directory exists (system/design.md §6.1 — v1 died with 226/NAMESPACE
# otherwise).
#
# The /data tree itself is created by the numbered migration 020-ble-init.sh, because
# /data is mounted late and its schema version gates the whole tree. What is listed here
# is only the runtime directory.
#
# The `proximos` user is declared by proximos-radio.sysusers.conf and is NOT re-declared
# here: one user for the whole merged component per decision #9. sysusers.d is idempotent
# so a duplicate would not error, but a second declaration invites the two drifting.
d /run/proximos 0755 proximos proximos -
d /run/proximos/ble 0750 proximos proximos -
