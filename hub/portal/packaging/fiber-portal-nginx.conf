# ProXimos HTTPS reverse proxy for the portal — included inside nginx's http {}.
#
# Replaces v1's fiber-nginx.conf. Two substantive changes beyond the port:
#
#   * v1's `location /ws` (WebSocket upgrade) is gone — v2 pushes live updates
#     over SSE instead (design.md §4), which needs buffering disabled rather
#     than a protocol upgrade. Proxying SSE through nginx's default buffered
#     mode is the classic failure here: the browser shows a live page that
#     never updates, with nothing wrong on either end.
#   * The portal binds 127.0.0.1:8088 only (not 8080 — v1's ChirpStack gRPC API
#     already owns that one, portal/src/config.rs), so it is never reachable
#     from the LAN without this file. v1 opened 8000 in the firewall alongside
#     443, making TLS bypassable (system/design.md §8.2) — that mistake is why
#     this proxies to loopback and nothing else opens the portal's own port.

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Written by proximos-tls-cert.service (recipes-core/tls/), a boot-time
    # oneshot ordered Before= this unit, so the pair always exists by the time
    # nginx reads it. server.crt is signed by the Hub-local CA beside it
    # (/data/tls/ca.crt, served at /connection/ca) with SAN <hostname> and
    # <hostname>.local (plan/control/cluster.md §6): a client that trusts
    # ca.crt verifies this server by name. The leaf alone is sent — a client
    # holds the CA as its trust anchor, so there is no intermediate to chain.
    # root:root 0600 is enough: meta-webserver's nginx.service has no User=,
    # so the master process itself reads this file while still root, not one
    # of the unprivileged workers `user www;` (nginx.conf) drops down to.
    ssl_certificate     /data/tls/server.crt;
    ssl_certificate_key /data/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:2m;
    ssl_session_timeout 1h;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    # Content-Security-Policy and Permissions-Policy come from the portal itself
    # (http.rs `security_headers`, GitLab #106): the policy has to follow the
    # templates. Do not add them here: add_header does not replace an upstream
    # header, so the browser would get two policies and enforce both.

    # Calibration-sheet uploads are the only inbound payload of any size; the
    # app enforces its own per-file limit on top of this.
    # 11m: a calibration certificate may be 10 MiB plus the multipart envelope (LE-20,
    # local E2E 2026-09-26); 8m answered a bare 413 for an 8-10 MB PDF the Portal accepts.
    client_max_body_size 11m;

    # Server-Sent Events. Every directive here is load-bearing:
    #   proxy_buffering off  — nginx must not hold fragments waiting for a full
    #                          buffer; without it the stream appears to hang.
    #   X-Accel-Buffering    — belt and braces for the same thing.
    #   read_timeout 24h     — an idle stream between keep-alives is normal.
    #   HTTP/1.1 + no Connection: close — SSE is a long-lived response, and
    #                          nginx defaults to HTTP/1.0 upstream.
    location /events {
        proxy_pass http://127.0.0.1:8088/events;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # A cluster Client runs no portal (plan/decisions.md #46): proximos-control writes a
    # read-only info page into /run/proximos/client-page, served here, and any 502-504 from
    # the dead upstream falls back to it. A location with its own add_header drops the
    # server-level ones, hence the repeats. A Server has no index.html there, so try_files
    # ends in the plain 502 it always had.
    location /_hub/ {
        alias /run/proximos/client-page/;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }
    location @client_page {
        root /run/proximos/client-page;
        try_files /index.html =502;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }
    # No `=`: the answer keeps its 502 status, so a probe still sees the portal is down.
    error_page 502 503 504 @client_page;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # CSV exports of a wide window can take a while to stream.
        proxy_read_timeout 300s;
    }

    # Static assets are proxied rather than served from the rootfs on purpose:
    # one code path, and the portal owns the cache policy (http.rs
    # `static_cache_control`: `?v=<content hash>` URLs are immutable,
    # everything else `no-cache`). Do not add `expires` or `Cache-Control`
    # here: an unversioned asset cached by nginx's rules would survive an
    # upgrade. Revisit only if a CM4 profile shows it matters.
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
