# ProXimos agent state on /data (system/design.md §6.1: every service ships
# its own tmpfiles.d fragment, no service may assume its directory exists).
#
# Owned by root, not a "fiber" account: fiber.service runs as root for this
# transitional package (see fiber.service's own comment) — no sysusers.d
# identity exists yet to own this instead.
#
# config/ and keys/ are declared here too, for the same "no service may
# assume its directory exists" reason as /data/fiber itself, but
# fiber-config-seed.sh and init-signer.sh (run from fiber.service's
# ExecStartPre, see that unit) each also `mkdir -p` their own target
# defensively before writing. That is deliberate belt-and-suspenders, not
# redundant: this file is a normal /usr/lib/tmpfiles.d/ fragment, applied by
# systemd-tmpfiles-setup.service, which is only ordered after
# local-fs.target — and /data is a `nofail` mount that local-fs.target does
# NOT wait for (see proximos-data-dirs.service's own comment on the same
# race). If tmpfiles runs before /data is mounted, these lines create their
# directories in the rootfs underneath the mount point instead of on /data,
# where the real mount then hides them. fiber.service declares
# RequiresMountsFor=/data/fiber, so its ExecStartPre lines only ever run once
# /data is genuinely mounted, and their own mkdir -p is what actually holds
# regardless of this race; these declarations are only insurance for the case
# tmpfiles wins it.
# keys/ is 0700 (private signing key inside); config/ is 0750, matching
# /data/fiber itself (MQTT/ChirpStack credentials live in the yaml it holds).
d /data/fiber        0750 root root -
d /data/fiber/config 0750 root root -
d /data/fiber/keys   0700 root root -
