# ProXimos portal service account (system/design.md §6.1: users come from
# sysusers.d fragments per package, never from useradd in a firstboot script).
#
# `proximos`, not a portal account of its own: fiber-portal.service runs as the
# merged component's one user ahead of the merge (decision #9,
# plan/portal/monolith.md §15, issue #88), because its in-process control.radio
# seam reads what `proximos` owns. v1 ran the viewer as root (meta-fiber#3);
# v2's first portal account, `fiber-portal`, is gone with this line.
#
# Field for field the line proximos-radio.sysusers.conf carries, so the fragment
# is complete on its own (this package does not depend on proximos-control).
# systemd-sysusers accepts an identical duplicate silently and warns only when two
# declarations of one name differ — keep the two in step.
u proximos - "ProXimos control" /var/lib/proximos -
