# ProXimos portal state on /data (system/design.md §6.1).
#
# Two independent reasons every one of these must exist before ExecStart:
#   1. systemd refuses to start a unit whose ReadWritePaths= target is missing.
#   2. Landlock builds its ruleset from handles opened at startup — a missing
#      directory means the portal degrades to unconfined and says so on
#      /health (security/landlock.md §1, "rules are attached to path
#      hierarchies opened at ruleset build time").
#
# calibrations lives here from day one rather than on the rootfs: v1 kept it
# under /opt/fiber-viewer and lost it on every RAUC update.
#
# Owner `proximos`, the unit's User= (plan/portal/monolith.md §15). A `d` line
# re-owns an existing directory but none of the files in it, which is why a
# unit upgraded from the `fiber-portal` era also needs migration
# 030-portal-owner.sh: it re-owns portal.db, db.key and the rest.
d /data/portal              0750 proximos proximos -
d /data/portal/exports      0750 proximos proximos -
d /data/portal/calibrations 0750 proximos proximos -

# SQLite's scratch directory (SQLITE_TMPDIR, set in main.rs). It lives under
# /data rather than /tmp for two reasons: the default candidates (/var/tmp,
# /tmp) are outside the Landlock table, and PrivateTmp=true makes both a tmpfs
# -- so a full VACUUM's temporary copy would be held in RAM, hundreds of MB on
# a populated Hub. main.rs creates it too; this fragment is what gives it the
# right owner on a device.
d /data/portal/tmp          0750 proximos proximos -

# The rendered-config directory is created by the renderer's own unit
# (proximos-render.service, RuntimeDirectory=proximos/portal, 0755 root); the
# portal only reads it. Listed here as a comment so the dependency is visible
# from this file: /run/proximos/portal/config.yaml, 0640 root:proximos.
