# Every service ships a tmpfiles.d fragment for its own directories; no service may
# assume its directory exists (system/design.md §6.1 — v1 died with 226/NAMESPACE
# otherwise).
#
# The /data tree itself is created by the numbered migration NNN-radio-init.sh, because
# /data is mounted late and its schema version gates the whole tree. What is listed here
# is only the runtime directory.
d /run/proximos 0755 proximos proximos -
d /run/proximos/radio 0750 proximos proximos -
# The Client's info page (plan/decisions.md #46): written by proximos-control, read by
# nginx's workers, hence 0755. Present on a Server too, where it stays empty.
d /run/proximos/client-page 0755 proximos proximos -
