[package]
name = "control-ble"
version = "0.1.0"
edition = "2021"
# Same floor as control-radio/proximosctl; the workspace toolchain is pinned to 1.94.0.
rust-version = "1.88"

# The lib target is `control_ble`: directory and package `control-ble`, lib `control_ble`,
# and `control.ble` is the command/dispatch namespace and nothing else (monolith.md §11.7 spelling rule).
[lib]
name = "control_ble"
path = "src/lib.rs"

# STANDALONE GUARANTEE (decision #12, plan/control/ble/plan.md §5): this crate may depend on no
# other crate in this workspace. External crates are fine; a `path = "../..."` line here is the
# thing that breaks the guarantee. Asserted by tests/standalone.rs.
[dependencies]
bluer = { version = "0.17", features = ["bluetoothd"] }
# systemd RestartUnit for the last recovery rung; already in the tree via bluer.
dbus = "0.9"
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3"
libc = "0.2"
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
subtle = "2.5"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "io-util",
    "fs",
    "signal",
] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "test-util"] }
