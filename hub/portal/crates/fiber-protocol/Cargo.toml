[package]
name = "fiber-protocol"
version = "0.1.0"
edition = "2021"

[dependencies]
aes-gcm = "0.10"
base64 = "0.21"
# X25519 for the sealed reply (sealed_reply.rs): already in the lock through ed25519-dalek.
curve25519-dalek = "4.1"
ed25519-dalek = { version = "2.1", features = ["std", "rand_core"] }
hex = "0.4.3"
# HKDF-SHA256 for the sealed reply: already in the lock through pbkdf2.
hmac = "0.12"
pbkdf2 = "0.12"
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
thiserror = "2.0.20"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1.8"
