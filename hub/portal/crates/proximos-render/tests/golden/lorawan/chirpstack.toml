# Rendered by `proximosctl render` (crates/proximos-render). Regenerated on
# every boot; edits made directly to this file are lost on the next render.
# Per-device overrides go in /data/proximos/config/proximos.config.yaml,
# merged over /usr/share/proximos/templates/defaults.yaml.
#
# This file carries the [api] secret — the JWT signing key behind every token
# in plan/control/radio/lorawan.md §4's table. It is written 0640
# root:chirpstack, which is the boundary chirpstack.service's own comment
# expects; the source of the value is /data/chirpstack/api-secret (0600
# root:root, generated by migration 005-chirpstack-seed.sh).

[logging]
level = "info"

# The SQLite backend. /data, not /var/lib: this is the device state that must survive a
# RAUC slot switch. The directory is created 0700 chirpstack:chirpstack by migration
# 005-chirpstack-seed.sh and handed to the service account by chirpstack-bootstrap.sh
# after `create-api-key` has applied the schema history as root.
[sqlite]
path = "sqlite:///data/chirpstack/chirpstack.sqlite"
# S-1 (2026-09-25): the built-in pragmas are only busy_timeout = 1000 and foreign_keys = ON,
# with the rollback journal. Two JoinRequests handled at once (two deduplication ids, one
# second) then made the second writer give up with "database is locked" and the Node rejoin
# a minute later. WAL lets the pool's readers run beside the one writer, and a 5 s busy
# timeout covers writer contention. The list replaces the built-in one, so foreign_keys stays.
pragmas = [
  "busy_timeout = 5000",
  "foreign_keys = ON",
  "journal_mode = WAL",
]

# Cache only — redis.conf ships with `save ""` and `appendonly no`, so nothing here is
# durable and nothing here needs a /data row. chirpstack.service still Requires= it: a
# ChirpStack that outlived its redis is a server that still answers RPCs and quietly
# loses uplinks.
[redis]
servers = ["redis://127.0.0.1:6379"]

[network]
# The experimental/private NetID. A Hub is a private network with no peering, so nothing
# here is allocated to us.
net_id = "000000"

# Must match the `name` of a [[regions]] entry in a region_*.toml sitting in this same
# directory. The renderer emits exactly one such file, region_eu868.toml, from
# radio.region — and deletes any other region_*.toml it finds here, because a stale
# region file with a mismatched topic_prefix is precisely the failure this pairing has.
enabled_regions = ["eu868"]

[api]
# ⚠ THIS LINE IS THE ENTIRE EXPOSURE STORY OF THIS DAEMON. ⚠
#
# Upstream's compiled-in default is 0.0.0.0:8080 — verified by reading the config
# template out of the 4.19.1 binary, not from the docs. Omitting this key does not mean
# "the safe thing"; it means the network-facing thing. That is v1 → v2 defect ledger #29
# (plan/system/design.md §12) in its second spelling, after the gateway-bridge's
# 0.0.0.0:1700.
#
# The only client is control-radio, in the same network namespace. proximos-firewall
# closes 8080 too, so this is defence in depth — but the firewall is another package's
# opinion and this is the daemon's own. Both stay.
bind = "127.0.0.1:8080"

# Injected from /data/chirpstack/api-secret. Rotating it invalidates every login and API
# token at once (lorawan.md §2), which is why migration 005 is idempotent about it and
# why chirpstack-bootstrap.sh re-asserts its 0600 root:root ownership after its recursive
# chown.
secret = "1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef"

[integration]
enabled = ["mqtt"]

[integration.mqtt]
# JSON rather than protobuf. chirpstack_api 4.19.0 — the version control-radio already
# depends on — declares a `json` feature and lists it in `default`, so the pbjson serde
# impls for integration::UplinkEvent are already compiled into the binary and WP-D's
# event decoder needs no Cargo change. The tie-breaker over protobuf is operability: an
# engineer with `mosquitto_sub` can read an uplink, which is the first step of every
# field report about a Node that stopped reporting.
json = true

# QoS 1 rather than upstream's 0, so an event publish is acknowledged by the broker instead
# of fire-and-forget (plan/portal/mqtt/design.md §6, amendment 2026-10-28, #115).
qos = 1

# Loopback, plain TCP, anonymous — the whole of this broker's security model, and
# deliberate: mosquitto ships a 127.0.0.1-only listener with no password file and
# proximos-firewall closes 1883 and 8883. The username/password/TLS fields stay at their
# empty defaults until that broker grows a password file; filling them in first would
# simply stop ChirpStack connecting.
server = "tcp://127.0.0.1:1883"

# event_topic and command_topic are left at upstream's defaults —
# application/{{application_id}}/device/{{dev_eui}}/event/{{event}} and the matching command form.
# WP-D's subscription (application/{app_id}/device/+/event/+) is written against exactly
# those, so pinning them here would be two places to change instead of one.
